workflows:
  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter pub get
      - name: Build iOS Release IPA
        script: |
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../../../ipa/AnimeKai_Movies.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/Products/Applications/*.zip
